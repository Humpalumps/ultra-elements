<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Ultra Elements</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #perf {
      position: fixed; left: 8px; top: 8px; width: max-content; min-width: 250px; box-sizing: border-box; padding: 10px 12px;
      font: 12px/1.35 system-ui, sans-serif; color: #e8f4ff; background: rgba(6, 10, 14, 0.6); border-radius: 8px;
    }
    #pGpu { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px; }
    #pSpec { font-size: 11px; opacity: 0.6; }
    .pRow { display: flex; align-items: baseline; gap: 4px; margin-top: 2px; }
    #pFps { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .pRow > i { font-style: normal; font-weight: 700; color: #2cc9ff; }
    .pRow > span { margin-left: auto; text-align: right; font-size: 11px; font-variant-numeric: tabular-nums; }
    #pMode { font-style: normal; font-size: 10px; font-weight: 700; letter-spacing: 2px; color: #2cc9ff; }
    #perf canvas { width: 100%; height: 24px; margin: 2px 0 8px; }
    #perf #pPhase { height: 6px; margin: 0 0 8px; border-radius: 3px; }
    #perf button {
      display: block; width: 100%; padding: 6px; border: 0; border-radius: 5px; cursor: pointer;
      font: 600 12px system-ui, sans-serif; color: #071018; background: #2cc9ff;
    }
    #pUncap.on { color: #ebebeb; background: #424242; }
    #perf #pBench { margin-top: 6px; color: #2cc9ff; background: none; box-shadow: inset 0 0 0 1px #2cc9ff; }
    #pBench:disabled { opacity: 0.5; cursor: default; }
    #hud { margin-top: 8px; font: 10px/1.35 ui-monospace, Consolas, monospace; white-space: pre; opacity: 0.75; }
    #hud:empty { display: none; }
    /* spell bar */
    #bar {
      position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; padding: 6px;
      max-width: calc(100vw - 28px); background: rgba(6, 10, 14, 0.6); border-radius: 10px; font: 600 12px system-ui, sans-serif;
    }
    #bar .els, #bar .spells { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
    #bar .spells:empty { display: none; }
    #bar .spells button { min-width: 0; padding: 6px 10px; font-weight: 500; }
    #bar input {
      width: 150px; padding: 6px 9px; border: 0; border-radius: 7px; font: inherit; font-weight: 500; color: #e8f4ff; outline: none;
      background: rgba(255, 255, 255, 0.06); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    #bar button {
      position: relative; min-width: 64px; padding: 9px 10px 7px; border: 0; border-radius: 7px; cursor: pointer;
      font: inherit; color: #e8f4ff; background: rgba(255, 255, 255, 0.06); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    #bar button b { position: absolute; left: 6px; top: 3px; font-size: 9px; opacity: 0.5; }
    #bar button.on { color: #071018; background: var(--hue); box-shadow: 0 0 18px -2px var(--hue); }
    #bar button:disabled { opacity: 0.35; cursor: default; }
    #loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 600 13px system-ui, sans-serif; color: #e8f4ff; opacity: 0.8; }
    #loading:empty { display: none; }
    #caption { position: fixed; left: 48px; bottom: 56px; font: 600 15px/1.2 system-ui, sans-serif; letter-spacing: 0.18em; text-transform: uppercase; color: var(--hue, #fff);
      text-shadow: 0 0 18px var(--hue, #fff), 0 1px 3px #000; opacity: 0; transition: opacity 0.4s; pointer-events: none; }
    #caption b { display: block; font-size: 42px; letter-spacing: 0.02em; text-transform: none; color: #fff; text-shadow: 0 0 24px var(--hue, #fff), 0 2px 6px #000; }
    #caption.on { opacity: 1; }
    .reel #bar, .reel #pUncap, .reel #pBench, .clean #perf { display: none; }
    /* the reel's lab demos: the settings panel fades in at a size that reads on video, the control being moved lit */
    .reel .lil-gui.lil-root { top: 40px; right: 40px; max-height: calc(100% - 80px); opacity: 0; pointer-events: none; transition: opacity 0.5s; --width: 600px; }
    .reel .lil-gui.lil-root, .reel .lil-gui.lil-root .lil-gui {   /* on every folder too: lil-gui sets these per .lil-gui */
      --font-size: 22px; --input-font-size: 22px; --widget-height: 40px; --title-height: 46px; --spacing: 9px; --padding: 9px; }
    .reel .lil-gui.lil-root > .lil-children > .lil-controller, .reel .lil-gui.lil-root > .lil-children > .lil-gui:not(.spell) { display: none; }   /* just the spell's own settings */
    .reel.lab .lil-gui.lil-root { opacity: 1; }
    .lil-controller.live { background: rgba(44, 201, 255, 0.3); box-shadow: inset 6px 0 #2cc9ff; }
    .reel #caption { left: 64px; bottom: 64px; font-size: 22px; }   /* sized for video */
    .reel #caption b { font-size: 60px; }
    /* phones (class set by main.js): perf panel to the bottom, spell bar scrolls at the top */
    #castBtn { display: none; }
    .mobile #perf { top: auto; bottom: calc(8px + env(safe-area-inset-bottom)); min-width: 0; padding: 6px 10px; font-size: 10px; }
    .mobile #perf:not(.open) > :not(.pRow) { display: none; }
    .mobile #perf:not(.open) .pRow { margin: 0; gap: 8px; align-items: center; }
    .mobile #perf:not(.open) .pRow > span { display: none; }
    .mobile #perf.open { max-height: 60dvh; overflow-y: auto; }
    .mobile #pFps { font-size: 18px; }
    .mobile #hud { font-size: 8px; }
    .mobile #bar { top: calc(6px + env(safe-area-inset-top)); bottom: auto; left: 6px; right: 6px; width: auto; max-width: none; padding: 5px; transform: none; box-sizing: border-box; }
    .mobile #bar button { flex: none; min-width: 0; padding: 7px 11px; }
    .mobile #bar button b, .mobile #bar input { display: none; }
    .mobile #bar .els, .mobile #bar .spells { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; scrollbar-width: none; }
    .mobile .lil-gui.lil-root { top: 86px; right: 6px; max-height: calc(100dvh - 180px); width: 190px; --width: 190px; }
    .mobile #castBtn {
      display: block; position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); width: 84px; height: 84px; margin-left: -42px; padding: 0;
      border: 2px solid var(--hue, #fff); border-radius: 50%; background: rgba(6, 10, 14, 0.55); box-shadow: 0 0 22px -4px var(--hue, #fff);
      color: #fff; font: 700 15px system-ui, sans-serif; letter-spacing: 0.06em; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    }
    .mobile #castBtn:active { background: var(--hue, #fff); color: #071018; }
    .reel #castBtn { display: none; }
  </style>
</head>
<body>
  <div id="perf">
    <div id="pGpu"></div>
    <div id="pSpec"></div>
    <div class="pRow"><b id="pFps">–</b><i>FPS</i><span><em id="pMode">VSYNC</em><br><span id="pMs"></span></span></div>
    <canvas id="pGraph" width="456" height="48"></canvas>
    <canvas id="pPhase" width="456" height="12" title="Active cast: charge, travel, impact, linger"></canvas>
    <button id="pUncap" type="button" title="Render frames back-to-back instead of once per display refresh, so the counter shows what this machine can do. The screen still updates at its own rate.">Uncap FPS</button>
    <button id="pBench" type="button" title="Cast the selected spell and render its whole timeline back-to-back with the loop paused, timed on the GPU. The screen freezes briefly while it runs.">Run benchmark</button>
    <div id="hud"></div>
  </div>
  <div id="bar"></div>
  <button id="castBtn" type="button">CAST</button>
  <div id="loading">Loading…</div>
  <div id="caption"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
